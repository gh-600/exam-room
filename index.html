<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>GH-600 Exam Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: an exam-delivery shell. A dark status bar on top (exam, question n of N, timer),
   one question per screen in a calm reading column, and a fixed action bar at the bottom
   (Previous · Mark for review · Review · Next). Start and results screens reuse the column. */
:root {
  --bg: #eef1f5;
  --paper: #ffffff;
  --ink: #1c2430;
  --muted: #5b6676;
  --line: #d3d9e2;
  --soft: #f4f6f9;
  --bar: #1f2b3a;
  --bar-ink: #e9eef5;
  --accent: #1d5fa8;
  --accent-ink: #ffffff;
  --accent-soft: #e2edf8;
  --flag: #a85d00;
  --flag-soft: #fbeedc;
  --ok: #187a3c;
  --ok-soft: #dff2e5;
  --bad: #b3261e;
  --bad-soft: #fae3e1;
  --warn: #8a5a00;
  --warn-soft: #fbf0d6;
  --code-bg: #f3f5f8;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --paper: #171e27; --ink: #e3e9f0; --muted: #98a4b3; --line: #2c3644; --soft: #1c2430;
    --bar: #0a0e13; --bar-ink: #dfe6ee; --accent: #5ea2ea; --accent-ink: #0b1520; --accent-soft: #16283d;
    --flag: #e7a54b; --flag-soft: #33240f; --ok: #4cc27a; --ok-soft: #132a1c; --bad: #f07067; --bad-soft: #351816;
    --warn: #e0b04a; --warn-soft: #2f2610; --code-bg: #121820; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --paper: #171e27; --ink: #e3e9f0; --muted: #98a4b3; --line: #2c3644; --soft: #1c2430;
  --bar: #0a0e13; --bar-ink: #dfe6ee; --accent: #5ea2ea; --accent-ink: #0b1520; --accent-soft: #16283d;
  --flag: #e7a54b; --flag-soft: #33240f; --ok: #4cc27a; --ok-soft: #132a1c; --bad: #f07067; --bad-soft: #351816;
  --warn: #e0b04a; --warn-soft: #2f2610; --code-bg: #121820; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.25; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.label { font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Status bar */
.statusbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-ink); }
.statusbar .inner { max-width: 980px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
.statusbar .exam { font-weight: 700; letter-spacing: 0.01em; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.statusbar .meta { display: flex; gap: 14px; align-items: center; font-size: 0.92rem; }
.timer { font-family: var(--font-mono); font-variant-numeric: tabular-nums; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; padding: 2px 8px; }
.pause-btn { background: transparent; color: var(--bar-ink); border: 1px solid rgba(255,255,255,0.3); padding: 2px 10px; font-size: 0.85rem; font-weight: 600; }
.pause-btn[aria-pressed="true"] { background: var(--flag); border-color: var(--flag); color: #fff; }
.timer.paused { opacity: 0.7; }
.timer.low { background: var(--bad); border-color: var(--bad); color: #fff; }

/* Page column */
main { max-width: 980px; margin: 0 auto; padding-block: 22px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h2 { font-size: 1.2rem; }
.row { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 0.88rem; font-weight: 600; }
input[type="number"], textarea, select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; min-width: 0; }
textarea { font-family: var(--font-mono); font-size: 0.82rem; min-height: 160px; width: 100%; resize: vertical; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.check-inline { display: inline-flex; gap: 6px; align-items: center; font-size: 0.95rem; }
.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.segmented label { padding: 6px 14px; cursor: pointer; font-size: 0.95rem; }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }

button { font: inherit; font-weight: 600; border-radius: 4px; padding: 8px 16px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
button.secondary { background: var(--paper); color: var(--accent); }
button.quiet { background: transparent; border-color: var(--line); color: var(--ink); font-weight: 500; }
button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.pill { display: inline-block; font-size: 0.78rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.idle { background: var(--soft); color: var(--muted); }
.notice { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 10px 12px; border-radius: 4px; font-size: 0.95rem; }
.notice.error { border-color: var(--bad); background: var(--bad-soft); }
.notice.info { border-color: var(--accent); background: var(--accent-soft); }
.notice ul { margin: 6px 0 0; padding-left: 20px; }

/* Bank summary */
.domain-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.domain-table td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
.domain-table td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }

/* Question screen */
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.qhead .qnum { font-weight: 700; font-size: 1.05rem; }
.scenario { background: var(--soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; max-height: 46vh; overflow: auto; }
.prose { display: flex; flex-direction: column; gap: 10px; max-width: 75ch; }
.prose ul { margin: 0; padding-left: 22px; }
.instruction { font-weight: 600; }
.options { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; background: var(--paper); }
.opt:hover { border-color: var(--accent); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin: 4px 0 0; width: 18px; height: 18px; accent-color: var(--accent); }
.opt .letter { font-weight: 700; margin-right: 6px; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.yn { display: flex; gap: 10px; flex-wrap: wrap; }
.yn .opt { grid-template-columns: 26px auto; min-width: 120px; }
.order-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.order-item { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; background: var(--paper); }
.order-item .pos { font-family: var(--font-mono); font-weight: 600; color: var(--muted); text-align: center; }
.order-item .moves { display: flex; gap: 6px; }
.order-item button { padding: 4px 10px; }
.prose pre.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.86rem; line-height: 1.5; white-space: pre; margin: 0 0 12px; }
.prose pre.code code { background: none; padding: 0; border: 0; font-size: inherit; }
.hot { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.86rem; line-height: 1.9; white-space: pre; margin: 0; }
.hot select { font-family: var(--font-mono); font-size: 0.86rem; padding: 1px 4px; border-color: var(--accent); }
.hot select.correct { border-color: var(--ok); background: var(--ok-soft); }
.hot select.wrong { border-color: var(--bad); background: var(--bad-soft); }
.feedback { border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); background: var(--soft); }
.feedback.ok { border-color: var(--ok); }
.feedback.bad { border-color: var(--bad); }
.why { grid-column: 2; font-size: 0.9rem; line-height: 1.45; padding-top: 6px; border-top: 1px dashed var(--line); margin-top: 4px; }
.why strong { margin-right: 4px; }
.opt.correct .why strong { color: var(--ok); }
.opt.wrong .why strong, .opt.missed .why strong { color: var(--bad); }
.opt.missed { border-color: var(--line); }
.takeaway { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 4px; }
.learnbar { display: flex; gap: 10px; flex-wrap: wrap; }
.why-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.md-h { margin: 6px 0 0; font-size: 1rem; }
.teach { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); background: var(--paper); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.teach h4 { margin: 0; font-size: 1.02rem; }
.evidence { display: flex; flex-direction: column; gap: 8px; }
.evidence blockquote { margin: 0; padding: 6px 12px; border-left: 3px solid var(--ok); background: var(--ok-soft); border-radius: 0 4px 4px 0; font-size: 0.95rem; }
.evidence .note { margin: 0; padding: 6px 12px; border-left: 3px solid var(--line); background: var(--soft); border-radius: 0 4px 4px 0; font-size: 0.95rem; }
.evidence cite { display: block; font-style: normal; font-size: 0.8rem; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
.lesson-nav { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.lesson-nav select { max-width: 100%; flex: 1 1 220px; min-width: 0; }
.lesson h2 { font-size: 1.35rem; }
.lesson .box { border-radius: var(--radius); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.lesson .box.example { background: var(--soft); border: 1px solid var(--line); }
.lesson .box.watch { background: var(--warn-soft); border-left: 4px solid var(--warn); }
.lesson .box.depth { background: var(--accent-soft); border-left: 4px solid var(--accent); }
.dots { display: flex; flex-wrap: wrap; gap: 5px; }
.dots button { width: 26px; height: 26px; padding: 0; border-radius: 50%; font-size: 0.72rem; font-family: var(--font-mono); background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.dots button.seen { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.dots button.current { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stmt-table { width: 100%; border-collapse: collapse; }
.stmt-table th { text-align: center; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); }
.stmt-table th:first-child { text-align: left; }
.stmt-table td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.stmt-table td.yn-cell { text-align: center; width: 64px; }
.stmt-table td.yn-cell input { width: 20px; height: 20px; accent-color: var(--accent); }
.stmt-table tr.correct td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
.stmt-table tr.wrong td:first-child { box-shadow: inset 4px 0 0 var(--bad); }
.build { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.build .col { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; background: var(--soft); }
.build .col h4 { margin: 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.build .chip { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; background: var(--paper); font-size: 0.95rem; }
.build .chip.numbered { grid-template-columns: 22px minmax(0, 1fr) auto; }
.build .chip .moves { display: flex; gap: 4px; }
.build .chip button { padding: 2px 8px; }
.build .chip.correct { border-color: var(--ok); background: var(--ok-soft); }
.build .chip.wrong { border-color: var(--bad); background: var(--bad-soft); }
.match { display: flex; flex-direction: column; gap: 10px; }
.match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; background: var(--paper); }
.match-row select { width: 100%; }
.match-row.correct { border-color: var(--ok); background: var(--ok-soft); }
.match-row.wrong { border-color: var(--bad); background: var(--bad-soft); }
.pool { display: flex; flex-wrap: wrap; gap: 6px; }
.pool span { border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font-size: 0.9rem; background: var(--soft); }
.sel-count { font-size: 0.88rem; color: var(--muted); }
.sel-count.warn { color: var(--warn); font-weight: 600; }
@media (max-width: 560px) { .build, .match-row { grid-template-columns: minmax(0, 1fr); } }
.sources { display: flex; flex-direction: column; gap: 2px; font-size: 0.86rem; overflow-wrap: anywhere; }

/* Bottom action bar */
.actionbar { position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.actionbar .inner { max-width: 980px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.actionbar .spacer { flex: 1 1 auto; }
.flag-btn[aria-pressed="true"] { background: var(--flag-soft); border-color: var(--flag); color: var(--flag); }

/* Review grid */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.88rem; }
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.tile { position: relative; border: 1px solid var(--line); border-radius: 4px; padding: 8px 4px; text-align: center; font-family: var(--font-mono); font-weight: 600; background: var(--paper); color: var(--ink); }
.tile.answered { background: var(--accent-soft); border-color: var(--accent); }
.tile.unanswered { background: var(--paper); border-style: dashed; }
.tile.flagged::after { content: ""; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--flag); }
.tile.locked { opacity: 0.55; cursor: not-allowed; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -1px; margin-right: 4px; }

/* Results */
.score { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
.score .big { font-family: var(--font-mono); font-size: 2.6rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 10px; background: var(--soft); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar > span { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.bar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.dom-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) minmax(90px, 2fr) 64px; gap: 10px; align-items: center; font-size: 0.92rem; }
.result-item { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.result-item summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; list-style: none; }
.result-item summary::-webkit-details-marker { display: none; }
.result-item .stem-preview { min-width: 0; flex: 1 1 260px; }
.ans-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 0.92rem; }
.history td, .history th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; font-size: 0.9rem; white-space: nowrap; }
.history th { font-weight: 600; color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; }
details.help summary { cursor: pointer; font-weight: 600; }
pre.example { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.8rem; margin: 0; }
@media (max-width: 560px) {
  .statusbar .exam { flex-basis: 100%; }
  .dom-row { grid-template-columns: 34px minmax(0, 1fr) 56px; }
  .dom-row .bar { grid-column: 1 / -1; }
  .actionbar button { padding: 8px 12px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<header class="statusbar" id="statusbar">
  <div class="inner">
    <div class="exam" id="sbTitle">GH-600 · Developing in Agentic AI Systems</div>
    <div class="meta">
      <span id="sbCount" class="mono"></span>
      <span id="sbTimer" class="timer" hidden></span>
      <button type="button" id="btnPause" class="pause-btn" aria-pressed="false" hidden>Pause</button>
    </div>
  </div>
</header>

<main id="main"></main>

<nav class="actionbar" id="actionbar" hidden aria-label="Exam navigation">
  <div class="inner">
    <button class="quiet" id="btnPrev" type="button">‹ Previous</button>
    <button class="quiet flag-btn" id="btnFlag" type="button" aria-pressed="false">Mark for review</button>
    <span class="spacer"></span>
    <button class="secondary" id="btnCheck" type="button" hidden>Check</button>
    <button class="quiet" id="btnReview" type="button">Review</button>
    <button id="btnNext" type="button">Next ›</button>
  </div>
</nav>

<script type="application/json" id="embeddedBank">{"title": "GH-600 · Module 3 · Tooling, MCP and execution environments", "version": 1, "author": "Claude. Lessons follow the Microsoft Learn module; answers checked against GitHub Docs on 27 November 2026.", "passingScore": 700, "durationMinutes": 45, "domains": {"D2": "Tool use and environment interaction"}, "modules": {"M3": {"title": "Tooling, MCP, and Agent Execution Environments", "url": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/", "units": {"U2": "How agents interact with GitHub APIs and workflows", "U3": "MCP servers, registries, and allow lists", "U4": "Execution context and boundaries", "U5": "Agent execution limits and protections"}}}, "nuggets": [{"id": "M3-U2-C1", "module": "M3", "unit": "U2", "domain": "D2", "skill": "Integrate agents within development environments", "status": "confirmed", "title": "Every agent action is an authenticated API call", "body": "Agents don't have a private way into GitHub. To create a branch, commit, open a pull request or start a workflow, they call the same GitHub APIs a developer's tools use.\n\nEvery call carries a token: a personal access token, a GitHub App token, or the `GITHUB_TOKEN` of a workflow. The token decides what the agent may do, and it's why every action is permission-controlled and shows up in the audit trail.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "sources": ["https://docs.github.com/en/actions/concepts/security/github_token"], "example": "An agent step in a workflow comments on a pull request. It can do that only because the job's `GITHUB_TOKEN` has `pull-requests: write`.", "depth": "`GITHUB_TOKEN` is created per job, works only on the repository that runs the workflow, and expires when the job ends. For work across several repositories, a GitHub App installation token is the least-privilege choice: short-lived, scoped to the repositories where the app is installed, and attributed to the app instead of a person.", "watch": "\"What can the agent do?\" is really \"what can its token do?\". An instruction such as \"only open pull requests\" doesn't limit anything; the token's permissions do."}, {"id": "M3-U2-C2", "module": "M3", "unit": "U2", "domain": "D2", "skill": "Integrate agents within development environments", "status": "learn-only", "title": "Agents follow the developer's path: branch, commit, pull request", "body": "When an agent changes a repository, it uses the standard sequence: choose a base branch, create a working branch, change files, commit, and open a pull request. There's a separate API operation for each step.\n\nThe point is alignment: agent work arrives in the same shape as human work, so the same reviews, checks and rules apply to it.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "sources": ["https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent"], "example": "Asked to fix a bug, Copilot cloud agent creates `copilot/fix-order-total` from `main`, pushes commits there and opens a pull request into `main`.", "watch": "An answer that has the agent pushing straight to the default branch, or deploying from its own session, is describing the anti-pattern."}, {"id": "M3-U2-C3", "module": "M3", "unit": "U2", "domain": "D2", "skill": "Integrate agents within development environments", "status": "confirmed", "title": "Traditional workflows and Agentic Workflows do different jobs", "body": "A traditional GitHub Actions workflow is deterministic: you write every step, trigger and condition in YAML. Use it for build, test and deploy.\n\nA GitHub Agentic Workflow describes the outcome in Markdown and lets a coding agent work out the steps, inside guardrails set in the frontmatter. It suits open-ended but bounded tasks: issue triage, reports, documentation upkeep, CI failure analysis, code improvement.\n\nAgentic Workflows extend CI/CD (\"Continuous AI\"). They don't replace it.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "sources": ["https://github.github.com/gh-aw/introduction/how-they-work/"], "example": "Building and testing every pull request stays a YAML workflow. A daily \"repository status\" issue written by an agent is an Agentic Workflow.", "watch": "If a scenario needs the same result every time (a release pipeline, a required check), the answer is a traditional workflow, not an agentic one."}, {"id": "M3-U2-C4", "module": "M3", "unit": "U2", "domain": "D2", "skill": "Select and configure agent tools", "status": "confirmed", "title": "Anatomy of an Agentic Workflow: frontmatter sets the limits, Markdown sets the intent", "body": "An Agentic Workflow file has two parts:\n\n- **Frontmatter** (YAML between `---` lines): triggers (`on:`), `permissions:`, `tools:` and `safe-outputs:`. These are the boundaries.\n- **Markdown body**: the task in natural language. This is the intent.\n\nThe file is compiled into a lock file (`.lock.yml`), which is the ordinary workflow GitHub Actions actually runs.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "sources": ["https://github.github.com/gh-aw/introduction/how-they-work/", "https://github.github.com/gh-aw/reference/safe-outputs/"], "example": "`permissions:` are all `read`, and `safe-outputs: create-issue` with a title prefix is the only write allowed. The body says \"Create a daily report for maintainers\".", "depth": "The agent job runs read-only. A separate job holds the write permission and applies only outputs that match what `safe-outputs` declares, so an injected instruction can't make the agent write anything else.", "watch": "Changing what the agent may do means changing the frontmatter and recompiling. Text in the Markdown body can't grant permissions."}, {"id": "M3-U2-C5", "module": "M3", "unit": "U2", "domain": "D2", "skill": "Operate agents with safe execution paths and robust error handling", "status": "confirmed", "title": "Agent sessions are visible, and you can steer them", "body": "An agent session isn't a black box. While it runs you can follow the session log, see each action the agent takes, give feedback or adjust the task, and then review the pull request it produces. The agent adapts and keeps working until the task is complete.\n\nWorkflows that validate its work can start in three ways: automatically on events such as `push` or `pull_request`, manually with `workflow_dispatch`, or through the API.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "sources": ["https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/track-copilot-sessions", "https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/use-cloud-agent-from-cli"], "example": "Half-way through, you see in the log that the agent is refactoring a file you didn't ask about. You comment on the pull request with `@copilot` to correct it, and it pushes a new commit.", "depth": "From a terminal, `gh agent-task view <pr> --log --follow` streams the same session log (public preview)."}, {"id": "M3-U3-C1", "module": "M3", "unit": "U3", "domain": "D2", "skill": "Configure MCP servers", "status": "confirmed", "title": "An MCP server exposes tools; it can be local or remote", "body": "Model Context Protocol (MCP) is a standard way for AI clients to use external tools. An MCP server sits between the agent and a system: it lists the tools it offers, accepts structured requests, and performs the real action.\n\nA **local** server runs on your machine: more control, access to local resources. A **remote** server is hosted and reached over the network: less setup, the same server everywhere.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "sources": ["https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers"], "example": "The GitHub MCP server gives an agent tools for repositories, issues and pull requests.", "depth": "For Copilot cloud agent, MCP servers are configured as JSON in the repository's Settings → Copilot → MCP servers. The top-level key is `mcpServers`, each server has a `type` (`local`, `stdio`, `http` or `sse`) and a required `tools` list. The cloud agent supports MCP tools only, not resources or prompts.", "watch": "Once a server is configured for the cloud agent, Copilot can call its tools without asking for approval. That's why the `tools` list should name specific tools instead of `\"*\"`."}, {"id": "M3-U3-C2", "module": "M3", "unit": "U3", "domain": "D2", "skill": "Configure MCP servers", "status": "confirmed", "title": "The GitHub remote MCP server: HTTP type and one URL", "body": "In an IDE such as VS Code, you add the GitHub MCP server from Copilot Chat in Agent mode (Tools → Add MCP server). For the remote server you choose **HTTP** as the type, enter `https://api.githubcopilot.com/mcp/`, choose the scope (this workspace or all workspaces) and authenticate with GitHub.\n\nRemote is the recommended setup for most users. GitHub Enterprise Server supports only the local server.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "sources": ["https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers"], "example": "`{ \"servers\": { \"github\": { \"type\": \"http\", \"url\": \"https://api.githubcopilot.com/mcp/\" } } }` in a workspace's MCP configuration.", "depth": "Copilot cloud agent already has the GitHub MCP server enabled by default, with a token that has read-only access to the current repository. Reaching beyond that repository needs a token with broader access that you configure.", "watch": "Remote = hosted URL + authentication. If an option pairs \"remote GitHub MCP server\" with a `localhost` address or a local command, it's wrong."}, {"id": "M3-U3-C3", "module": "M3", "unit": "U3", "domain": "D2", "skill": "Configure MCP servers", "status": "confirmed", "title": "A registry is a catalogue of MCP servers, with strict technical requirements", "body": "An MCP registry is a central catalogue where clients discover which servers exist and how to install them. IDEs use the GitHub MCP Registry by default, and an organisation or enterprise can point Copilot at a custom one.\n\nA custom registry must:\n\n- follow the MCP registry **v0.1** specification;\n- expose `GET /v0.1/servers` and the two `…/versions/…` endpoints over HTTPS;\n- send the CORS headers that let Copilot read it.\n\nYou can self-host the open-source registry, build your own, or use **Azure API Center**.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "sources": ["https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-mcp-usage/configure-mcp-server-access"], "example": "With Azure API Center you enable anonymous access and enter only the base URL in the Copilot policy, without `/v0.1/servers`.", "watch": "A registry makes servers discoverable. It doesn't block anything by itself; that's the allow list policy."}, {"id": "M3-U3-C4", "module": "M3", "unit": "U3", "domain": "D2", "skill": "Configure MCP servers", "status": "confirmed", "title": "The allow list policy: \"Allow all\" or \"Registry only\"", "body": "The allow list is a Copilot policy at organisation or enterprise level. First, **MCP servers in Copilot** must be enabled. Then **Restrict MCP access to registry servers** has two values:\n\n- **Allow all**: developers can use any MCP server.\n- **Registry only**: only servers listed in the configured registry.\n\nUnder Registry only, even local servers must be in the registry, and their server IDs must match exactly. The policy applies immediately, and it's tied to the organisation or enterprise that assigns the user's Copilot seat.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "sources": ["https://docs.github.com/en/copilot/reference/enterprise-administrators/mcp-allowlist-enforcement", "https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-mcp-usage/configure-mcp-server-access"], "example": "Contoso lists four approved servers, one of them local, in its registry and selects Registry only. A developer's unlisted server stops working.", "depth": "Enforcement happens in the clients (VS Code, Visual Studio, JetBrains, Copilot CLI and others, from specific versions). **Copilot in the cloud isn't in the list of enforcing surfaces**: the cloud agent is governed by its repository MCP configuration. Enforcement matches server names/IDs, is in public preview and can be bypassed by editing config files; GitHub recommends `managed-settings.json` for stronger restriction. With several seats, an enterprise policy beats an organisation policy, and Registry only beats Allow all.", "watch": "Setting a registry URL while leaving \"Allow all\" restricts nothing. And a local server that isn't in the registry is blocked under Registry only."}, {"id": "M3-U3-C5", "module": "M3", "unit": "U3", "domain": "D2", "skill": "Configure MCP servers", "status": "learn-only", "title": "Server, registry, allow list: three different jobs", "body": "The three MCP concepts solve different parts of one problem:\n\n- The **server** exposes tools.\n- The **registry** makes servers discoverable and standard to install.\n- The **allow list** decides which servers are permitted.\n\nTogether they give agents more capabilities without the organisation losing control.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "sources": ["https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-mcp-usage/configure-mcp-server-access"], "example": "Flow: the organisation publishes a registry and sets the policy → the developer's IDE discovers approved servers → the developer enables one → the agent uses its tools.", "watch": "Questions often describe one need and offer all three as options. Ask: is this about *doing* (server), *finding* (registry) or *permitting* (allow list)?"}, {"id": "M3-U4-C1", "module": "M3", "unit": "U4", "domain": "D2", "skill": "Integrate agents within development environments", "status": "learn-only", "title": "Execution context: repository, branch, workflow, permissions", "body": "Execution context is the set of constraints that says where an agent operates and what it can reach. On GitHub it has four parts:\n\n- the **repository** it works in;\n- the **branch** it targets;\n- the **workflow** that runs its tasks;\n- the **permissions** granted to that workflow.\n\nThese decide both what the agent can see and what it can do. Without a defined context, agent behaviour is unpredictable and unsafe.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/4-execution-context-boundaries", "sources": ["https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent"], "example": "An agent in CI could create releases nobody expected. The repository, branch and workflow were right; the workflow's token permissions were too broad.", "watch": "When a scenario asks which boundary failed, map the symptom to one of the four. \"Changed the wrong repo\" is scope, \"changed main directly\" is branch, \"did more than it should\" is permissions."}, {"id": "M3-U4-C2", "module": "M3", "unit": "U4", "domain": "D2", "skill": "Integrate agents within development environments", "status": "confirmed", "title": "Repository scope is the first boundary", "body": "Copilot cloud agent always works inside one repository. It reads and changes code there, and works with that repository's issues, pull requests and workflows. It has no access to other repositories unless that's explicitly granted.\n\nYou enable and configure it per repository: Settings → Copilot → Cloud.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/4-execution-context-boundaries", "sources": ["https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent", "https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers"], "example": "Asked to also update a shared library that lives in another repository, the agent can't. That's a separate task in that repository.", "depth": "The agent's built-in GitHub MCP token has read-only access to the current repository only.", "watch": "Don't \"fix\" a scope limit by handing the agent a broad personal token. Split the work per repository."}, {"id": "M3-U4-C3", "module": "M3", "unit": "U4", "domain": "D2", "skill": "Select and configure agent tools", "status": "confirmed", "title": "What a custom agent controls, and what it doesn't", "body": "A custom agent is a file in `.github/agents/` with the `.agent.md` extension. It defines what the agent may do (its `tools`) and how it behaves (its instructions).\n\nIt does **not** define branch creation, pull request behaviour or execution isolation. Those belong to the system that runs the agent: the cloud agent creates the branch and pull request itself, and in CI the workflow decides the branch.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/4-execution-context-boundaries", "sources": ["https://docs.github.com/en/copilot/reference/custom-agents-configuration"], "example": "A `security-reviewer` agent whose tools are limited to reading and searching can analyse code but can't edit it, whatever its prompt says.", "depth": "If `tools` is omitted, the agent gets all available tools. Tool restriction is enforced by the platform; instructions are guidance.", "watch": "There's no agent-file setting for \"target branch\" or \"open a draft PR\". If an option invents one, discard it."}, {"id": "M3-U4-C4", "module": "M3", "unit": "U4", "domain": "D2", "skill": "Integrate agents within development environments", "status": "confirmed", "title": "Branch-based scope: the agent builds on the base branch you choose", "body": "Agents never work directly on the main branch. The agent creates a new branch from the branch you selected, makes its changes there, and opens a pull request that targets that base branch.\n\nWhen you delegate a task you can choose a base branch other than the default one. The isolation is enforced by the execution context, not by the agent's own configuration.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/4-execution-context-boundaries", "sources": ["https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations", "https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/use-cloud-agent-from-cli"], "example": "You delegate a task with base branch `release/2.4`. The agent creates `copilot/…` from it and its pull request targets `release/2.4`, not `main`.", "depth": "The agent can push only to the branches it creates. From the CLI, `gh agent-task create \"…\" --base release/2.4` sets the base branch.", "watch": "Unpushed local commits aren't on GitHub, so the agent can't see them. Push your branch before delegating."}, {"id": "M3-U4-C5", "module": "M3", "unit": "U4", "domain": "D2", "skill": "Select and configure agent tools", "status": "confirmed", "title": "Permission boundaries: explicit and minimal", "body": "Permissions define what an agent can do inside its context. Workflows get them through tokens such as `GITHUB_TOKEN`, and they cover reading contents, writing code, creating pull requests and triggering workflows.\n\nThe rule: define permissions explicitly and keep them minimal.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/4-execution-context-boundaries", "sources": ["https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax", "https://docs.github.com/en/actions/concepts/security/github_token"], "example": "A nightly agent job that summarises changes and posts an issue comment needs `contents: read` and `issues: write`, and nothing else.", "depth": "In `permissions:`, once you declare any scope, every scope you don't declare becomes `none`. Declare them at job level so only the job that needs a write permission has it.", "watch": "`permissions: write-all`, or no `permissions:` key in a repository whose default is read and write, both break least privilege."}, {"id": "M3-U4-C6", "module": "M3", "unit": "U4", "domain": "D2", "skill": "Operate agents with safe execution paths and robust error handling", "status": "learn-only", "title": "Agentic Workflows are built for defence in depth", "body": "GitHub Agentic Workflows stack several guardrails:\n\n- **read-only tokens by default**, so the agent can inspect but not change;\n- **safe outputs**: the agent proposes, a separate gated step decides;\n- **zero secrets in the agent process**;\n- **sandboxed, containerised execution**;\n- **network isolation** with an allowlist for outbound access;\n- **threat detection** that scans proposed outputs before any write.\n\nTogether they reduce the risk of over-privileged agents, prompt injection and unintended changes.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/4-execution-context-boundaries", "sources": ["https://github.github.com/gh-aw/introduction/how-they-work/", "https://github.github.com/gh-aw/reference/safe-outputs/"], "example": "An issue contains hidden text telling the agent to close every other issue. The agent may propose it, but `close-issue` isn't a declared safe output, so nothing happens.", "watch": "No single control is the answer to prompt injection. Look for the option that removes the agent's ability to write, not the one that asks it nicely."}, {"id": "M3-U4-C7", "module": "M3", "unit": "U4", "domain": "D2", "skill": "Integrate agents within development environments", "status": "learn-only", "title": "Running an agent in CI: the workflow is the boundary", "body": "To run an agent as part of CI, you invoke it inside a workflow. The workflow fixes everything around it: the trigger (`workflow_dispatch`, `schedule`, `push`, `pull_request`), the `permissions:`, the runner, the checkout, the authentication, and the non-interactive command that runs the agent, optionally with a named custom agent.\n\nThe task runs on a defined runner, from a defined trigger, in one repository, with only the permissions granted to that workflow.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/4-execution-context-boundaries", "sources": ["https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax"], "example": "A workflow on `schedule` checks out the repository and runs the agent with a prompt and no user interaction, with `permissions: contents: read`.", "watch": "In CI nobody is there to approve a tool call. The limits must come from the workflow (permissions, secrets passed in), not from interactive prompts."}, {"id": "M3-U5-C1", "module": "M3", "unit": "U5", "domain": "D2", "skill": "Integrate agents within development environments", "status": "confirmed", "title": "Platform limits: one repository, a separate branch, a human decision", "body": "Copilot cloud agent works within limits it can't change: it has access only to the repository where it's working, and it makes its changes on a separate branch, never directly on the default branch.\n\nIt prepares changes for review; it doesn't finalise them. Reviewing, requesting updates, discarding or merging stays with you.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/5-agent-execution-limits-protections", "sources": ["https://docs.github.com/en/copilot/concepts/security-governance-and-network-settings/risks-and-mitigations"], "example": "The agent finishes and requests review. Nothing reaches `main` until a person approves and merges.", "depth": "The agent can't merge its pull requests, and the person who asked Copilot for the work can't be the one who approves it."}, {"id": "M3-U5-C2", "module": "M3", "unit": "U5", "domain": "D2", "skill": "Select and configure agent tools", "status": "confirmed", "title": "Repository and organisation settings limit what workflows can run", "body": "Agent work runs in workflows, and settings above the workflow file constrain it. Repository and organisation settings control which workflows and actions are allowed to run, and what `GITHUB_TOKEN` is permitted to do by default.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/5-agent-execution-limits-protections", "sources": ["https://docs.github.com/en/actions/concepts/security/github_token"], "example": "An organisation allows only GitHub's own actions and verified creators, and sets the default workflow token to read-only. A workflow an agent writes can't pull in an unknown third-party action.", "depth": "These live under Settings → Actions → General: the allowed-actions policy and \"Workflow permissions\". A workflow file can still request more with `permissions:`, which is why changes under `.github/workflows/` need review."}, {"id": "M3-U5-C3", "module": "M3", "unit": "U5", "domain": "D2", "skill": "Operate agents with safe execution paths and robust error handling", "status": "confirmed", "title": "Error handling: fail fast, never continue silently", "body": "Workflows should handle agent failures explicitly: stop when a step fails, log a meaningful message, and avoid leaving partial or inconsistent changes.\n\nA step fails the job by default. `continue-on-error: true` turns that off, which is how a failed agent step ends up followed by a commit of half-finished output.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/5-agent-execution-limits-protections", "sources": ["https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax"], "example": "The agent step exits with an error, but the next step still commits and pushes. The agent step had `continue-on-error: true`.", "depth": "`continue-on-error` defaults to `false`. Later steps run after a failure only if they opt in with `if: always()` or `if: failure()`, which is right for uploading logs and wrong for publishing results."}, {"id": "M3-U5-C4", "module": "M3", "unit": "U5", "domain": "D2", "skill": "Operate agents with safe execution paths and robust error handling", "status": "learn-only", "title": "Retries are for transient failures only", "body": "A retry helps when the failure is temporary: a network issue, a rate limit, a transient service error. You can re-run failed steps, add retry logic to a script, or structure the workflow so it's safe to run again.\n\nRetrying doesn't help when the cause is permanent: a failing test, a missing permission, a merge conflict. Those need a fix or a human.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/5-agent-execution-limits-protections", "sources": [], "example": "A call to the model API times out once; the second attempt succeeds. A `403` from a missing permission fails the same way every time.", "watch": "A retry is only safe if the step can run twice without doing damage, for example without creating two pull requests. And a retry loop must still fail the job when every attempt fails."}, {"id": "M3-U5-C5", "module": "M3", "unit": "U5", "domain": "D2", "skill": "Operate agents with safe execution paths and robust error handling", "status": "learn-only", "title": "Rollback: isolation first, revert second", "body": "If an agent produces incorrect or unsafe changes, rollback keeps them out of the main codebase. Most of it comes for free from the way agents work: changes sit on a branch behind a pull request, so closing or discarding the pull request undoes everything.\n\nIf the change was already merged, revert the commits.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/5-agent-execution-limits-protections", "sources": [], "example": "A merged agent pull request breaks `main`. You open a revert pull request, let the required checks run, and merge it; the fix comes later in a new pull request.", "watch": "Force-pushing the default branch back to an old commit is not the rollback path: it rewrites history and a ruleset normally blocks it. Use a revert through a pull request."}, {"id": "M3-U5-C6", "module": "M3", "unit": "U5", "domain": "D2", "skill": "Operate agents with safe execution paths and robust error handling", "status": "learn-only", "title": "Escalation and traceability: a human can step in, and everything leaves a record", "body": "**Escalation** means that when an agent can't finish or is unsure, a person takes over. Implement it by requiring pull request review, assigning reviewers automatically, or notifying maintainers from a workflow step.\n\n**Traceability** means every agent action can be inspected and attributed. GitHub provides it through workflow logs, commit history and pull request discussions. Clear commit messages and one branch per task make it better.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/5-agent-execution-limits-protections", "sources": [], "example": "An agent can't make the tests pass after several attempts. It says so in the pull request, which already has the code owners requested as reviewers.", "depth": "CODEOWNERS is the built-in way to assign reviewers automatically; it becomes mandatory only when the ruleset requires review from code owners."}, {"id": "M3-U5-C7", "module": "M3", "unit": "U5", "domain": "D2", "skill": "Operate agents with safe execution paths and robust error handling", "status": "confirmed", "title": "Environments protect deployments of agent-generated changes", "body": "When agent-generated changes are deployed, environments add safeguards. An environment can require approval before a job continues, restrict access to secrets, and control deployment targets.\n\nThis keeps sensitive operations from running automatically.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/5-agent-execution-limits-protections", "sources": ["https://docs.github.com/en/actions/reference/workflows-and-actions/deployments-and-environments"], "example": "The `deploy` job declares `environment: production`. It pauses until a required reviewer approves, and only then receives the production secrets.", "depth": "Environment secrets reach only jobs that declare that environment. Referring to an environment name that doesn't exist creates a new one with no protection.", "watch": "Environments gate jobs, not merges. A required reviewer on `production` doesn't stop a pull request being merged."}, {"id": "M3-U5-C8", "module": "M3", "unit": "U5", "domain": "D2", "skill": "Integrate agents within development environments", "status": "confirmed", "title": "`GITHUB_TOKEN` doesn't start new workflow runs; other tokens can", "body": "Most actions performed with `GITHUB_TOKEN` don't trigger further workflow runs. That's deliberate: it prevents loops where a workflow keeps triggering itself.\n\nGitHub App tokens and personal access tokens can trigger further runs. That allows richer automation, and it also means you have to design against recursion.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/5-agent-execution-limits-protections", "sources": ["https://docs.github.com/en/actions/concepts/security/github_token"], "example": "A workflow on `push` formats code and pushes the result. With `GITHUB_TOKEN` it stops there. With a personal token, that push triggers the workflow again.", "depth": "The exceptions for `GITHUB_TOKEN` are `workflow_dispatch` and `repository_dispatch`, which do start runs. A pull request opened or updated with `GITHUB_TOKEN` gets runs that wait for approval from someone with write access."}], "conflicts": [{"module": "M3", "unit": "U3", "learnSays": "A local MCP server is added like a remote one, with a local endpoint such as `http://localhost:3000`.", "docsSay": "Local servers are normally started as a command over `stdio` (`type` `local` or `stdio` with `command` and `args`), not addressed by a localhost URL.", "source": "https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers"}, {"module": "M3", "unit": "U4", "learnSays": "A custom agent file scopes files with `applyTo`, and its tools are named `read_file` and `search_files`.", "docsSay": "`applyTo` belongs to `*.instructions.md` files, not to agent files; check tool names in the custom agents configuration reference.", "source": "https://docs.github.com/en/copilot/reference/custom-agents-configuration"}, {"module": "M3", "unit": "U4", "learnSays": "The CI example runs `npx @github/copilot-cli` authenticated with `secrets.GITHUB_TOKEN`.", "docsSay": "The package and authentication details differ; check the Copilot CLI docs before copying the example.", "source": "https://docs.github.com/en/copilot/how-tos/copilot-cli/install-copilot-cli"}, {"module": "M3", "unit": "U5", "learnSays": "The agent \"doesn't automatically create a pull request\"; you decide whether to create one.", "docsSay": "Unit 2 of the same module, and the cloud agent docs, describe the agent opening the pull request itself. What is certain: it can't merge, and review stays with a human.", "source": "https://docs.github.com/en/copilot/concepts/agents/cloud-agent/about-cloud-agent"}, {"module": "M3", "unit": "U5", "learnSays": "The retry example loops three times with `&& break` and `sleep 5`.", "docsSay": "As written, the step succeeds even when all three attempts fail, because the last command is `sleep`. A retry loop must exit non-zero after the final failure.", "source": "https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax"}], "questions": [{"id": "m3-u2-app-token", "type": "single", "domain": "D2", "module": "M3", "unit": "U2", "nugget": "M3-U2-C1", "level": "apply", "stem": "Contoso runs an automation agent that opens dependency-update pull requests in three repositories of the `contoso` organisation. It currently authenticates with a classic personal access token that belongs to a repository administrator.\n\nSecurity requires that the agent's actions are attributed to the automation and not to a person, that its credentials are short-lived, and that it can reach only those three repositories.\n\nWhat should you use?", "options": [{"id": "a", "text": "The `GITHUB_TOKEN` of a workflow in one of the repositories, with `permissions: write-all`.", "rationale": "Incorrect. `GITHUB_TOKEN` only works on the repository that runs the workflow, so it can't open pull requests in the other two."}, {"id": "b", "text": "A fine-grained personal access token that belongs to a service account.", "rationale": "Incorrect. It can be limited to three repositories, but it's long-lived and tied to a user account."}, {"id": "c", "text": "A deploy key added to each of the three repositories.", "rationale": "Incorrect. A deploy key gives git access to one repository; it can't call the API to open pull requests."}, {"id": "d", "text": "An installation token from a GitHub App installed on only those three repositories.", "rationale": "Correct. Installation tokens are short-lived, limited to the repositories where the app is installed and to its permissions, and actions are attributed to the app."}], "answer": ["d"], "explanation": "Every agent action is an authenticated API call, so the token defines the agent's reach. A GitHub App gives short-lived, narrowly scoped credentials with their own identity.", "takeaway": "Cross-repository automation → GitHub App installation token.", "sources": ["https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "https://docs.github.com/en/actions/concepts/security/github_token"], "evidence": [{"quote": "All API requests must be authenticated using tokens such as personal access tokens, GitHub App tokens, or the GITHUB_TOKEN provided in workflows.", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "label": "Microsoft Learn"}, {"quote": "This ensures that every action an agent performs is permission-controlled and auditable.", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "label": "Microsoft Learn"}, {"note": "`GITHUB_TOKEN` is limited to the repository that runs the workflow and expires when the job ends, so it can't serve three repositories. A GitHub App installation token is short-lived and limited to the repositories where the app is installed.", "source": "https://docs.github.com/en/actions/concepts/security/github_token", "label": "GitHub Docs"}]}, {"id": "m3-u2-which-workflow", "type": "match", "domain": "D2", "module": "M3", "unit": "U2", "nugget": "M3-U2-C3", "level": "analyse", "reuse": true, "stem": "Your team is deciding which tasks to implement as traditional GitHub Actions workflows and which as GitHub Agentic Workflows.\n\nWhich type should you use for each task?", "choices": [{"id": "yaml", "text": "Traditional workflow (YAML)"}, {"id": "aw", "text": "Agentic Workflow"}], "targets": [{"id": "t1", "text": "Build and test every pull request as a required check.", "answer": "yaml", "rationale": "A required check must be deterministic and repeatable."}, {"id": "t2", "text": "Triage new issues: read them and suggest labels.", "answer": "aw", "rationale": "Open-ended but bounded, and it needs judgement about free text."}, {"id": "t3", "text": "Deploy a tagged release to production.", "answer": "yaml", "rationale": "Deployment needs explicit, predictable steps behind an environment gate."}, {"id": "t4", "text": "Analyse why a CI run failed and summarise the likely cause.", "answer": "aw", "rationale": "CI failure analysis is one of the tasks Agentic Workflows are designed for."}, {"id": "t5", "text": "Write a daily repository status report as an issue.", "answer": "aw", "rationale": "Reporting is a typical Continuous AI task."}], "explanation": "Agentic Workflows extend CI/CD for open-ended, bounded tasks. Anything that must behave the same way every time stays a traditional workflow.", "takeaway": "Deterministic → YAML. Open-ended but bounded → agentic. Agentic never replaces CI/CD.", "sources": ["https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "https://github.github.com/gh-aw/introduction/how-they-work/"], "evidence": [{"quote": "They're best suited to open-ended but bounded repository tasks such as triage, reporting, documentation maintenance, CI failure analysis, and code improvement.", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "label": "Microsoft Learn"}, {"quote": "They don't replace CI/CD pipelines; they extend them with what GitHub describes as \"Continuous AI.\"", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "label": "Microsoft Learn"}, {"quote": "Traditional GitHub Actions workflows are usually deterministic and YAML-defined: you explicitly specify each step, trigger, and condition.", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "label": "Microsoft Learn"}]}, {"id": "m3-u2-anatomy", "type": "statements", "domain": "D2", "module": "M3", "unit": "U2", "nugget": "M3-U2-C4", "level": "understand", "stem": "You are reviewing a GitHub Agentic Workflow file.\n\nFor each of the following statements, select Yes if the statement is true. Otherwise, select No.", "items": [{"id": "a", "statement": "The Markdown body is where you define the workflow's triggers and permissions.", "answer": "no", "explanation": "Triggers, permissions, tools and safe outputs go in the frontmatter. The body holds the instructions."}, {"id": "b", "statement": "GitHub Actions runs the lock file that is compiled from the Markdown file.", "answer": "yes", "explanation": "The workflow is compiled to a `.lock.yml` file, and that is what Actions executes."}, {"id": "c", "statement": "With all permissions set to `read`, the agent can still create an issue if `create-issue` is declared as a safe output.", "answer": "yes", "explanation": "The agent proposes the issue; a separate gated job with the write permission creates it."}], "takeaway": "Frontmatter = boundaries, Markdown = intent, lock file = what runs, safe outputs = the only writes.", "sources": ["https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "https://github.github.com/gh-aw/introduction/how-they-work/", "https://github.github.com/gh-aw/reference/safe-outputs/"], "evidence": [{"quote": "Frontmatter for configuration such as triggers, permissions, tools, and safe outputs", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "label": "Microsoft Learn"}, {"quote": "The Markdown expresses intent, while the frontmatter defines the boundaries. The workflow is then compiled into a lock file that GitHub Actions executes.", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "label": "Microsoft Learn"}, {"quote": "Safe outputs that let the agent propose actions while a separate gated step decides what is allowed", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/4-execution-context-boundaries", "label": "Microsoft Learn"}]}, {"id": "m3-u2-steer", "type": "single", "domain": "D2", "module": "M3", "unit": "U2", "nugget": "M3-U2-C5", "level": "apply", "stem": "You assign an issue to GitHub Copilot cloud agent. Twenty minutes later the session log shows it's rewriting a module that's outside the issue's scope. The rest of its work is good and you want to keep it.\n\nWhat should you do?", "options": [{"id": "a", "text": "Give the agent feedback on its pull request so that it adjusts its work and pushes a corrected commit.", "rationale": "Correct. Sessions are interactive: you can adjust the task while the work is in progress, and the agent adapts."}, {"id": "b", "text": "Close the pull request and assign the issue to the agent again.", "rationale": "Incorrect. That discards the work you wanted to keep."}, {"id": "c", "text": "Push a commit to the default branch that reverts the module.", "rationale": "Incorrect. The agent's changes are on its own branch, not on the default branch, so there's nothing to revert there."}, {"id": "d", "text": "Wait until the session ends, because a running session can't be influenced.", "rationale": "Incorrect. Sessions are observable and you can provide feedback during them."}], "answer": ["a"], "explanation": "Agent sessions are visible and interactive: monitor the log, give feedback, review the pull request.", "takeaway": "Watch the session log and steer early; don't throw the work away.", "sources": ["https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "https://docs.github.com/en/copilot/how-tos/use-copilot-agents/cloud-agent/track-copilot-sessions"], "evidence": [{"quote": "Agent sessions are observable and interactive.", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "label": "Microsoft Learn"}, {"quote": "Provide feedback or adjust the task", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "label": "Microsoft Learn"}, {"quote": "The agent adapts based on feedback and continues working until the task is complete.", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/2-interact-github-apis-workflows", "label": "Microsoft Learn"}]}, {"id": "m3-u3-remote-config", "type": "dropdown", "domain": "D2", "module": "M3", "unit": "U3", "nugget": "M3-U3-C2", "level": "apply", "stem": "You are adding the GitHub **remote** MCP server to a VS Code workspace so that Copilot's agent can use it.\n\nHow should you complete the configuration? Select the correct option for each box.", "template": "{\n  \"servers\": {\n    \"github\": {\n      \"type\": \"[[type]]\",\n      \"url\": \"[[url]]\"\n    }\n  }\n}", "blanks": {"type": {"options": ["http", "stdio", "local"], "answer": "http", "rationale": "A remote server is reached over the network, so the type is HTTP. `stdio` and `local` start a process on your machine."}, "url": {"options": ["https://api.githubcopilot.com/mcp/", "http://localhost:3000", "https://api.github.com/v0.1/servers"], "answer": "https://api.githubcopilot.com/mcp/", "rationale": "This is the hosted GitHub MCP server. `localhost` would be a local server, and `/v0.1/servers` is a registry endpoint, not a server."}}, "explanation": "The remote GitHub MCP server is added as an HTTP server at `https://api.githubcopilot.com/mcp/`, then you authenticate with GitHub.", "takeaway": "Remote GitHub MCP server = type HTTP + api.githubcopilot.com/mcp/ + sign in.", "sources": ["https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists"], "evidence": [{"quote": "Select HTTP as the server type", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "label": "Microsoft Learn"}, {"quote": "Enter the server URL (example for GitHub MCP server):", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "label": "Microsoft Learn"}, {"quote": "https://api.githubcopilot.com/mcp/", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "label": "Microsoft Learn"}, {"quote": "A remote MCP server is hosted elsewhere and accessed over the network.", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "label": "Microsoft Learn"}]}, {"id": "m3-u3-api-center", "type": "multiple", "domain": "D2", "module": "M3", "unit": "U3", "nugget": "M3-U3-C3", "level": "analyse", "select": 2, "stem": "An enterprise administrator hosts the company's MCP registry in Azure API Center and enters `https://contoso.data.eastus.azure-apicenter.ms/v0.1/servers` as the MCP Registry URL in the Copilot policy. Developers' IDEs show no servers from the registry.\n\nWhich two changes should the administrator make? Each correct answer presents part of the solution.", "options": [{"id": "a", "text": "Enable anonymous access on the API Center registry.", "rationale": "Correct. Copilot must be able to fetch the registry without credentials."}, {"id": "b", "text": "Enter only the base URL of the API Center endpoint, without `/v0.1/servers`.", "rationale": "Correct. For Azure API Center the policy takes the base URL only."}, {"id": "c", "text": "Change the policy from \"Registry only\" to \"Allow all\".", "rationale": "Incorrect. That removes the restriction; it doesn't make the registry readable."}, {"id": "d", "text": "Add each developer's GitHub account as a reader on the API Center resource.", "rationale": "Incorrect. Copilot reads the registry anonymously, not as each developer."}, {"id": "e", "text": "Publish the registry over HTTP instead of HTTPS.", "rationale": "Incorrect. The registry endpoints must be served over HTTPS."}], "answer": ["a", "b"], "explanation": "Azure API Center can act as the MCP registry if anonymous access is enabled and the policy holds the base URL only.", "takeaway": "Azure API Center registry: anonymous access + base URL only.", "sources": ["https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-mcp-usage/configure-mcp-server-access"], "evidence": [{"quote": "Enable anonymous access so Copilot can fetch the registry", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "label": "Microsoft Learn"}, {"quote": "If using Azure API Center, enter the base URL only (do not include /v0.1/servers)", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "label": "Microsoft Learn"}]}, {"id": "m3-u3-registry-only", "type": "yesno", "domain": "D2", "module": "M3", "unit": "U3", "nugget": "M3-U3-C4", "level": "evaluate", "goal": "Does this meet the goal?", "scenario": "This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals.\n\nFabrikam has an MCP registry that lists three approved remote servers. Developers also need one approved **local** MCP server that reads build logs.\n\n**Goal:** developers must be able to use only approved MCP servers in their IDEs, including the local one.", "items": [{"id": "s1", "solution": "Enter the registry URL in the Copilot policy, select **Registry only**, and add the local server to the registry with a server ID that exactly matches the installed server.", "answer": "yes", "explanation": "Registry only limits developers to registry servers, and a local server is permitted when it's listed with a matching ID."}, {"id": "s2", "solution": "Enter the registry URL in the Copilot policy and leave the restriction set to **Allow all**.", "answer": "no", "explanation": "With Allow all, developers can add any server. The registry only helps discovery."}, {"id": "s3", "solution": "Select **Registry only**, and tell developers to configure the local server by hand in their IDE because it doesn't need to be in the registry.", "answer": "no", "explanation": "Under Registry only, local servers must also be in the registry, so the hand-configured server is blocked."}], "takeaway": "Registry only blocks everything not in the registry, local servers included; Allow all restricts nothing.", "sources": ["https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "https://docs.github.com/en/copilot/reference/enterprise-administrators/mcp-allowlist-enforcement"], "evidence": [{"quote": "If the Allow all option is selected, developers can add and use any MCP server without restrictions.", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "label": "Microsoft Learn"}, {"quote": "If Registry only is selected, developers are limited to using only the MCP servers defined in the configured registry. In this case, even local MCP servers must be included in the registry, and their server IDs must match exactly.", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "label": "Microsoft Learn"}]}, {"id": "m3-u3-cloud-agent", "type": "single", "domain": "D2", "module": "M3", "unit": "U3", "nugget": "M3-U3-C4", "level": "analyse", "stem": "An organisation sets the Copilot MCP policy to **Registry only**. A week later, an audit shows that GitHub Copilot cloud agent in one repository uses an MCP server that isn't in the registry. The server is defined in that repository's Copilot settings.\n\nWhat is the most likely explanation?", "options": [{"id": "a", "text": "The policy takes up to 30 days to apply to existing repositories.", "rationale": "Incorrect. The policy applies immediately to the clients that enforce it."}, {"id": "b", "text": "The registry allow list is enforced by IDE and CLI clients; the cloud agent uses the MCP configuration of its repository.", "rationale": "Correct. Copilot in the cloud isn't among the surfaces that enforce the allow list, so its MCP servers are governed by the repository configuration."}, {"id": "c", "text": "The server's ID in the registry differs in letter case from the installed server.", "rationale": "Incorrect. A mismatched ID would block a server under Registry only, not allow an unlisted one."}, {"id": "d", "text": "The repository administrator's Copilot seat is assigned by a different organisation.", "rationale": "Incorrect. Seat assignment decides which policy applies to a user's clients; it doesn't explain the cloud agent's behaviour."}], "answer": ["b"], "explanation": "Allow list enforcement happens in specific clients. For the cloud agent, review the repository's MCP configuration and keep its `tools` list narrow.", "takeaway": "Registry only governs developers' clients; govern the cloud agent through its repository MCP configuration.", "sources": ["https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "https://docs.github.com/en/copilot/reference/enterprise-administrators/mcp-allowlist-enforcement", "https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers"], "evidence": [{"quote": "GitHub supports MCP allowlist enforcement at the organization and enterprise level, tied to the Copilot seat that governs the user.", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "label": "Microsoft Learn"}, {"note": "The table of supported surfaces gives a minimum version for allow list enforcement in Copilot CLI, VS Code, Visual Studio, JetBrains, Eclipse and Xcode. Copilot in the cloud has no enforcement version listed.", "source": "https://docs.github.com/en/copilot/reference/enterprise-administrators/mcp-allowlist-enforcement", "label": "GitHub Docs"}, {"note": "The cloud agent's MCP servers are configured as JSON in the repository's Settings → Copilot → MCP servers.", "source": "https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers", "label": "GitHub Docs"}]}, {"id": "m3-u3-three-roles", "type": "match", "domain": "D2", "module": "M3", "unit": "U3", "nugget": "M3-U3-C5", "level": "understand", "reuse": false, "stem": "You are explaining MCP governance to a new team.\n\nWhich component meets each need?", "choices": [{"id": "server", "text": "MCP server"}, {"id": "registry", "text": "MCP registry"}, {"id": "allow", "text": "Allow list policy"}, {"id": "fw", "text": "Cloud agent firewall"}], "targets": [{"id": "t1", "text": "Expose the ticketing system's operations as tools an agent can call.", "answer": "server", "rationale": "The server exposes tools and performs the real action."}, {"id": "t2", "text": "Let developers browse and install the company's approved servers from their IDE.", "answer": "registry", "rationale": "The registry is the catalogue used for discovery and standard installation."}, {"id": "t3", "text": "Prevent developers from using any server the company hasn't approved.", "answer": "allow", "rationale": "The allow list decides which servers are permitted."}], "explanation": "Server exposes, registry discovers, allow list permits. The firewall limits the cloud agent's network access and isn't part of this model.", "takeaway": "Doing = server. Finding = registry. Permitting = allow list.", "sources": ["https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists"], "evidence": [{"quote": "MCP server exposes tools", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "label": "Microsoft Learn"}, {"quote": "Registry makes servers discoverable and trustable", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "label": "Microsoft Learn"}, {"quote": "Allow list decides which servers are permitted", "source": "https://learn.microsoft.com/en-us/training/modu
