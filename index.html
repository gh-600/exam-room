<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>GH-600 Exam Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: an exam-delivery shell. A dark status bar on top (exam, question n of N, timer),
   one question per screen in a calm reading column, and a fixed action bar at the bottom
   (Previous · Mark for review · Review · Next). Start and results screens reuse the column. */
:root {
  --bg: #eef1f5;
  --paper: #ffffff;
  --ink: #1c2430;
  --muted: #5b6676;
  --line: #d3d9e2;
  --soft: #f4f6f9;
  --bar: #1f2b3a;
  --bar-ink: #e9eef5;
  --accent: #1d5fa8;
  --accent-ink: #ffffff;
  --accent-soft: #e2edf8;
  --flag: #a85d00;
  --flag-soft: #fbeedc;
  --ok: #187a3c;
  --ok-soft: #dff2e5;
  --bad: #b3261e;
  --bad-soft: #fae3e1;
  --warn: #8a5a00;
  --warn-soft: #fbf0d6;
  --code-bg: #f3f5f8;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --paper: #171e27; --ink: #e3e9f0; --muted: #98a4b3; --line: #2c3644; --soft: #1c2430;
    --bar: #0a0e13; --bar-ink: #dfe6ee; --accent: #5ea2ea; --accent-ink: #0b1520; --accent-soft: #16283d;
    --flag: #e7a54b; --flag-soft: #33240f; --ok: #4cc27a; --ok-soft: #132a1c; --bad: #f07067; --bad-soft: #351816;
    --warn: #e0b04a; --warn-soft: #2f2610; --code-bg: #121820; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --paper: #171e27; --ink: #e3e9f0; --muted: #98a4b3; --line: #2c3644; --soft: #1c2430;
  --bar: #0a0e13; --bar-ink: #dfe6ee; --accent: #5ea2ea; --accent-ink: #0b1520; --accent-soft: #16283d;
  --flag: #e7a54b; --flag-soft: #33240f; --ok: #4cc27a; --ok-soft: #132a1c; --bad: #f07067; --bad-soft: #351816;
  --warn: #e0b04a; --warn-soft: #2f2610; --code-bg: #121820; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bar); }
a { color: var(--accent); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.25; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.88rem; }
.label { font-size: 0.74rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Status bar */
.statusbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bar); color: var(--bar-ink); }
.statusbar .inner { max-width: 980px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
.statusbar .exam { font-weight: 700; letter-spacing: 0.01em; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.statusbar .meta { display: flex; gap: 14px; align-items: center; font-size: 0.92rem; }
.timer { font-family: var(--font-mono); font-variant-numeric: tabular-nums; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); border-radius: 4px; padding: 2px 8px; }
.pause-btn { background: transparent; color: var(--bar-ink); border: 1px solid rgba(255,255,255,0.3); padding: 2px 10px; font-size: 0.85rem; font-weight: 600; }
.pause-btn[aria-pressed="true"] { background: var(--flag); border-color: var(--flag); color: #fff; }
.timer.paused { opacity: 0.7; }
.timer.low { background: var(--bad); border-color: var(--bad); color: #fff; }

/* Page column */
main { max-width: 980px; margin: 0 auto; padding-block: 22px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel h2 { font-size: 1.2rem; }
.row { display: flex; gap: 10px 16px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 0.88rem; font-weight: 600; }
input[type="number"], textarea, select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; min-width: 0; }
textarea { font-family: var(--font-mono); font-size: 0.82rem; min-height: 160px; width: 100%; resize: vertical; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.check-inline { display: inline-flex; gap: 6px; align-items: center; font-size: 0.95rem; }
.segmented { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.segmented label { padding: 6px 14px; cursor: pointer; font-size: 0.95rem; }
.segmented input { position: absolute; opacity: 0; pointer-events: none; }
.segmented label:has(input:checked) { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.segmented label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }

button { font: inherit; font-weight: 600; border-radius: 4px; padding: 8px 16px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
button.secondary { background: var(--paper); color: var(--accent); }
button.quiet { background: transparent; border-color: var(--line); color: var(--ink); font-weight: 500; }
button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 8px 14px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.guide-mod summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.guide-mod summary h3 { margin: 0; font-size: 1.05rem; display: inline; }
.guide-mod ul { margin: 6px 0 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
.guide-mod li { display: flex; gap: 8px; align-items: flex-start; }
.guide-mod li input { margin-top: 4px; flex: none; }
.guide-mod a { overflow-wrap: anywhere; }
.guide-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px 24px; margin-top: 10px; }
.guide-cols h4 { margin: 0 0 4px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.pill { display: inline-block; font-size: 0.78rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.idle { background: var(--soft); color: var(--muted); }
.notice { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 10px 12px; border-radius: 4px; font-size: 0.95rem; }
.notice.error { border-color: var(--bad); background: var(--bad-soft); }
.notice.info { border-color: var(--accent); background: var(--accent-soft); }
.notice ul { margin: 6px 0 0; padding-left: 20px; }

/* Bank summary */
.domain-table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
.domain-table td { padding: 5px 6px; border-bottom: 1px solid var(--line); }
.domain-table td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }

/* Question screen */
.qhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.qhead .qnum { font-weight: 700; font-size: 1.05rem; }
.scenario { background: var(--soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; max-height: 46vh; overflow: auto; }
.prose { display: flex; flex-direction: column; gap: 10px; max-width: 75ch; }
.prose ul { margin: 0; padding-left: 22px; }
.instruction { font-weight: 600; }
.options { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; background: var(--paper); }
.opt:hover { border-color: var(--accent); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin: 4px 0 0; width: 18px; height: 18px; accent-color: var(--accent); }
.opt .letter { font-weight: 700; margin-right: 6px; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.yn { display: flex; gap: 10px; flex-wrap: wrap; }
.yn .opt { grid-template-columns: 26px auto; min-width: 120px; }
.order-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.order-item { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; background: var(--paper); }
.order-item .pos { font-family: var(--font-mono); font-weight: 600; color: var(--muted); text-align: center; }
.order-item .moves { display: flex; gap: 6px; }
.order-item button { padding: 4px 10px; }
.prose pre.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.86rem; line-height: 1.5; white-space: pre; margin: 0 0 12px; }
.prose pre.code code { background: none; padding: 0; border: 0; font-size: inherit; }
.hot { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.86rem; line-height: 1.9; white-space: pre; margin: 0; }
.hot select { font-family: var(--font-mono); font-size: 0.86rem; padding: 1px 4px; border-color: var(--accent); max-width: min(100%, 62vw); }
.hot select.correct { border-color: var(--ok); background: var(--ok-soft); }
.hot select.wrong { border-color: var(--bad); background: var(--bad-soft); }
.feedback { border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); background: var(--soft); }
.feedback.ok { border-color: var(--ok); }
.feedback.bad { border-color: var(--bad); }
.why { grid-column: 2; font-size: 0.9rem; line-height: 1.45; padding-top: 6px; border-top: 1px dashed var(--line); margin-top: 4px; }
.why strong { margin-right: 4px; }
.opt.correct .why strong { color: var(--ok); }
.opt.wrong .why strong, .opt.missed .why strong { color: var(--bad); }
.opt.missed { border-color: var(--line); }
.why-exam { border: 1px dashed var(--line); border-radius: 4px; padding: 8px 12px; }
.why-exam summary { cursor: pointer; }
.takeaway { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 8px 12px; border-radius: 4px; }
.learnbar { display: flex; gap: 10px; flex-wrap: wrap; }
.why-list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
.md-h { margin: 6px 0 0; font-size: 1rem; }
.teach { border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--radius); background: var(--paper); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.teach h4 { margin: 0; font-size: 1.02rem; }
.evidence { display: flex; flex-direction: column; gap: 8px; }
.evidence blockquote { margin: 0; padding: 6px 12px; border-left: 3px solid var(--ok); background: var(--ok-soft); border-radius: 0 4px 4px 0; font-size: 0.95rem; }
.evidence .note { margin: 0; padding: 6px 12px; border-left: 3px solid var(--line); background: var(--soft); border-radius: 0 4px 4px 0; font-size: 0.95rem; }
.evidence cite { display: block; font-style: normal; font-size: 0.8rem; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
.lesson-nav { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.lesson-nav select { max-width: 100%; flex: 1 1 220px; min-width: 0; }
.lesson h2 { font-size: 1.35rem; }
.lesson .box { border-radius: var(--radius); padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.lesson .box.example { background: var(--soft); border: 1px solid var(--line); }
.lesson .box.watch { background: var(--warn-soft); border-left: 4px solid var(--warn); }
.lesson .box.depth { background: var(--accent-soft); border-left: 4px solid var(--accent); }
.dots { display: flex; flex-wrap: wrap; gap: 5px; }
.dots button { width: 26px; height: 26px; padding: 0; border-radius: 50%; font-size: 0.72rem; font-family: var(--font-mono); background: var(--paper); color: var(--muted); border: 1px solid var(--line); }
.dots button.seen { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.dots button.current { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stmt-table { width: 100%; border-collapse: collapse; }
.stmt-table th { text-align: center; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); }
.stmt-table th:first-child { text-align: left; }
.stmt-table td { padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.stmt-table td.yn-cell { text-align: center; width: 64px; }
.stmt-table td.yn-cell input { width: 20px; height: 20px; accent-color: var(--accent); }
.stmt-table tr.correct td:first-child { box-shadow: inset 4px 0 0 var(--ok); }
.stmt-table tr.wrong td:first-child { box-shadow: inset 4px 0 0 var(--bad); }
.build { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.build .col { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; background: var(--soft); }
.build .col h4 { margin: 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.build .chip { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; background: var(--paper); font-size: 0.95rem; }
.build .chip.numbered { grid-template-columns: 22px minmax(0, 1fr) auto; }
.build .chip .moves { display: flex; gap: 4px; }
.build .chip button { padding: 2px 8px; }
.build .chip.correct { border-color: var(--ok); background: var(--ok-soft); }
.build .chip.wrong { border-color: var(--bad); background: var(--bad-soft); }
.match { display: flex; flex-direction: column; gap: 10px; }
.match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; background: var(--paper); }
.match-row select { width: 100%; }
.match-row.correct { border-color: var(--ok); background: var(--ok-soft); }
.match-row.wrong { border-color: var(--bad); background: var(--bad-soft); }
.pool { display: flex; flex-wrap: wrap; gap: 6px; }
.pool span { border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; font-size: 0.9rem; background: var(--soft); }
.sel-count { font-size: 0.88rem; color: var(--muted); }
.sel-count.warn { color: var(--warn); font-weight: 600; }
@media (max-width: 560px) { .build, .match-row { grid-template-columns: minmax(0, 1fr); } }
.sources { display: flex; flex-direction: column; gap: 2px; font-size: 0.86rem; overflow-wrap: anywhere; }

/* Bottom action bar */
.actionbar { position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--paper); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.actionbar .inner { max-width: 980px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.actionbar .spacer { flex: 1 1 auto; }
.flag-btn[aria-pressed="true"] { background: var(--flag-soft); border-color: var(--flag); color: var(--flag); }

/* Review grid */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.88rem; }
.tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.tile { position: relative; border: 1px solid var(--line); border-radius: 4px; padding: 8px 4px; text-align: center; font-family: var(--font-mono); font-weight: 600; background: var(--paper); color: var(--ink); }
.tile.answered { background: var(--accent-soft); border-color: var(--accent); }
.tile.unanswered { background: var(--paper); border-style: dashed; }
.tile.flagged::after { content: ""; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--flag); }
.tile.locked { opacity: 0.55; cursor: not-allowed; }
.swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -1px; margin-right: 4px; }

/* Results */
.score { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
.score .big { font-family: var(--font-mono); font-size: 2.6rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 10px; background: var(--soft); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar > span { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.bar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.dom-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) minmax(90px, 2fr) 64px; gap: 10px; align-items: center; font-size: 0.92rem; }
.result-item { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.result-item summary { cursor: pointer; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; list-style: none; }
.result-item summary::-webkit-details-marker { display: none; }
.result-item .stem-preview { min-width: 0; flex: 1 1 260px; }
.ans-grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; font-size: 0.92rem; }
.history td, .history th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; font-size: 0.9rem; white-space: nowrap; }
.history th { font-weight: 600; color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; }
details.help summary { cursor: pointer; font-weight: 600; }
pre.example { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.8rem; margin: 0; }
@media (max-width: 560px) {
  .statusbar .exam { flex-basis: 100%; }
  .dom-row { grid-template-columns: 34px minmax(0, 1fr) 56px; }
  .dom-row .bar { grid-column: 1 / -1; }
  .actionbar button { padding: 8px 12px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<header class="statusbar" id="statusbar">
  <div class="inner">
    <div class="exam" id="sbTitle">GH-600 · Developing in Agentic AI Systems</div>
    <div class="meta">
      <span id="sbCount" class="mono"></span>
      <span id="sbTimer" class="timer" hidden></span>
      <button type="button" id="btnPause" class="pause-btn" aria-pressed="false" hidden>Pause</button>
      <button type="button" id="btnQuit" class="pause-btn" hidden>Quit</button>
    </div>
  </div>
</header>

<main id="main"></main>

<nav class="actionbar" id="actionbar" hidden aria-label="Exam navigation">
  <div class="inner">
    <button class="quiet" id="btnPrev" type="button">‹ Previous</button>
    <button class="quiet flag-btn" id="btnFlag" type="button" aria-pressed="false">Mark for review</button>
    <span class="spacer"></span>

<script type="application/json" id="embeddedBank">{"version": 1, "author": "Six questions from the former Module 3 bank, one per exam format, to try the app. Checked against GitHub Docs; not reviewed by an independent expert.", "passingScore": 700, "durationMinutes": 12, "domains": {"D2": "Tool use and environment interaction"}, "modules": {"M3": {"title": "Tooling, MCP, and Agent Execution Environments", "url": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/", "units": {"U2": "How agents interact with GitHub APIs and workflows", "U3": "MCP servers, registries, and allow lists", "U4": "Execution context and boundaries", "U5": "Agent execution limits and protections"}}}, "title": "Sample · 6 questions, one per format", "nuggets": [{"id": "M3-U3-C2", "module": "M3", "unit": "U3", "domain": "D2", "skill": "Configure MCP servers", "status": "confirmed", "title": "The GitHub remote MCP server: HTTP type and one URL", "body": "In an IDE such as VS Code, you add the GitHub MCP server from Copilot Chat in Agent mode (Tools → Add MCP server). For the remote server you choose **HTTP** as the type, enter `https://api.githubcopilot.com/mcp/`, choose the scope (this workspace or all workspaces) and authenticate with GitHub.\n\nRemote is the recommended setup for most users. GitHub Enterprise Server supports only the local server.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "sources": ["https://docs.github.com/en/copilot/how-tos/copilot-on-github/customize-copilot/configure-mcp-servers"], "example": "`{ \"servers\": { \"github\": { \"type\": \"http\", \"url\": \"https://api.githubcopilot.com/mcp/\" } } }` in a workspace's MCP configuration.", "depth": "Copilot cloud agent already has the GitHub MCP server enabled by default, with a token that has read-only access to the current repository. Reaching beyond that repository needs a token with broader access that you configure.", "watch": "Remote = hosted URL + authentication. If an option pairs \"remote GitHub MCP server\" with a `localhost` address or a local command, it's wrong."}, {"id": "M3-U3-C3", "module": "M3", "unit": "U3", "domain": "D2", "skill": "Configure MCP servers", "status": "confirmed", "title": "A registry is a catalogue of MCP servers, with strict technical requirements", "body": "An MCP registry is a central catalogue where clients discover which servers exist and how to install them. IDEs use the GitHub MCP Registry by default, and an organisation or enterprise can point Copilot at a custom one.\n\nA custom registry must:\n\n- follow the MCP registry **v0.1** specification;\n- expose `GET /v0.1/servers` and the two `…/versions/…` endpoints over HTTPS;\n- send the CORS headers that let Copilot read it.\n\nYou can self-host the open-source registry, build your own, or use **Azure API Center**.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "sources": ["https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-mcp-usage/configure-mcp-server-access"], "example": "With Azure API Center you enable anonymous access and enter only the base URL in the Copilot policy, without `/v0.1/servers`.", "watch": "A registry makes servers discoverable. It doesn't block anything by itself; that's the allow list policy."}, {"id": "M3-U3-C4", "module": "M3", "unit": "U3", "domain": "D2", "skill": "Configure MCP servers", "status": "confirmed", "title": "The allow list policy: \"Allow all\" or \"Registry only\"", "body": "The allow list is a Copilot policy at organisation or enterprise level. First, **MCP servers in Copilot** must be enabled. Then **Restrict MCP access to registry servers** has two values:\n\n- **Allow all**: developers can use any MCP server.\n- **Registry only**: only servers listed in the configured registry.\n\nUnder Registry only, even local servers must be in the registry, and their server IDs must match exactly. The policy applies immediately, and it's tied to the organisation or enterprise that assigns the user's Copilot seat.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "sources": ["https://docs.github.com/en/copilot/reference/enterprise-administrators/mcp-allowlist-enforcement", "https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-mcp-usage/configure-mcp-server-access"], "example": "Contoso lists four approved servers, one of them local, in its registry and selects Registry only. A developer's unlisted server stops working.", "depth": "Enforcement happens in the clients (VS Code, Visual Studio, JetBrains, Copilot CLI and others, from specific versions). **Copilot in the cloud isn't in the list of enforcing surfaces**: the cloud agent is governed by its repository MCP configuration. Enforcement matches server names/IDs, is in public preview and can be bypassed by editing config files; GitHub recommends `managed-settings.json` for stronger restriction. With several seats, an enterprise policy beats an organisation policy, and Registry only beats Allow all.", "watch": "Setting a registry URL while leaving \"Allow all\" restricts nothing. And a local server that isn't in the registry is blocked under Registry only."}, {"id": "M3-U3-C5", "module": "M3", "unit": "U3", "domain": "D2", "skill": "Configure MCP servers", "status": "learn-only", "title": "Server, registry, allow list: three different jobs", "body": "The three MCP concepts solve different parts of one problem:\n\n- The **server** exposes tools.\n- The **registry** makes servers discoverable and standard to install.\n- The **allow list** decides which servers are permitted.\n\nTogether they give agents more capabilities without the organisation losing control.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/3-model-context-protocol-servers-registries-allow-lists", "sources": ["https://docs.github.com/en/copilot/how-tos/administer-copilot/manage-mcp-usage/configure-mcp-server-access"], "example": "Flow: the organisation publishes a registry and sets the policy → the developer's IDE discovers approved servers → the developer enables one → the agent uses its tools.", "watch": "Questions often describe one need and offer all three as options. Ask: is this about *doing* (server), *finding* (registry) or *permitting* (allow list)?"}, {"id": "M3-U4-C5", "module": "M3", "unit": "U4", "domain": "D2", "skill": "Select and configure agent tools", "status": "confirmed", "title": "Permission boundaries: explicit and minimal", "body": "Permissions define what an agent can do inside its context. Workflows get them through tokens such as `GITHUB_TOKEN`, and they cover reading contents, writing code, creating pull requests and triggering workflows.\n\nThe rule: define permissions explicitly and keep them minimal.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/4-execution-context-boundaries", "sources": ["https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax", "https://docs.github.com/en/actions/concepts/security/github_token"], "example": "A nightly agent job that summarises changes and posts an issue comment needs `contents: read` and `issues: write`, and nothing else.", "depth": "In `permissions:`, once you declare any scope, every scope you don't declare becomes `none`. Declare them at job level so only the job that needs a write permission has it.", "watch": "`permissions: write-all`, or no `permissions:` key in a repository whose default is read and write, both break least privilege."}, {"id": "M3-U4-C7", "module": "M3", "unit": "U4", "domain": "D2", "skill": "Integrate agents within development environments", "status": "learn-only", "title": "Running an agent in CI: the workflow is the boundary", "body": "To run an agent as part of CI, you invoke it inside a workflow. The workflow fixes everything around it: the trigger (`workflow_dispatch`, `schedule`, `push`, `pull_request`), the `permissions:`, the runner, the checkout, the authentication, and the non-interactive command that runs the agent, optionally with a named custom agent.\n\nThe task runs on a defined runner, from a defined trigger, in one repository, with only the permissions granted to that workflow.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/4-execution-context-boundaries", "sources": ["https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax"], "example": "A workflow on `schedule` checks out the repository and runs the agent with a prompt and no user interaction, with `permissions: contents: read`.", "watch": "In CI nobody is there to approve a tool call. The limits must come from the workflow (permissions, secrets passed in), not from interactive prompts."}, {"id": "M3-U5-C5", "module": "M3", "unit": "U5", "domain": "D2", "skill": "Operate agents with safe execution paths and robust error handling", "status": "learn-only", "title": "Rollback: isolation first, revert second", "body": "If an agent produces incorrect or unsafe changes, rollback keeps them out of the main codebase. Most of it comes for free from the way agents work: changes sit on a branch behind a pull request, so closing or discarding the pull request undoes everything.\n\nIf the change was already merged, revert the commits.", "learn": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/5-agent-execution-limits-protections", "sources": [], "example": "A merged agent pull request breaks `main`. You open a revert pull request, let the required checks run, and merge it; the fix comes later in a new pull request.", "watch": "Force-pushing the default branch back to an old commit is not the rollback path: it rewrites history and a ruleset normally blocks it. Use a revert through a pull request."}], "conflicts": [], "questions": [{"id": "m3-u4-least-priv", "type": "single", "domain": "D2", "module": "M3", "unit": "U4", "nugget": "M3-U4-C5", "level": "apply", "stem": "A scheduled workflow runs an agent every night. The agent reads the repository's recent commits and posts a summary as a comment on a tracking issue. The repository's default workflow permissions are set to read and write.\n\nYou need to follow least privilege. Which configuration should you use for the job?", "options": [{"id": "a", "text": "No `permissions:` key, so the job uses the repository default.", "rationale": "Incorrect. The default here is read and write for every scope."}, {"id": "b", "text": "`permissions: write-all`", "rationale": "Incorrect. It grants every scope at write level."}, {"id": "c", "text": "`permissions: { contents: write, issues: write }`", "rationale": "Incorrect. The job only reads code, so `contents: write` is more than it needs."}, {"id": "d", "text": "`permissions: { contents: read, issues: write }`", "rationale": "Correct. It can read the repository and comment on an issue; every other scope becomes `none`."}], "answer": ["d"], "explanation": "Permissions should be explicit and minimal. Declaring scopes sets all undeclared ones to `none`.", "takeaway": "Declare only the scopes the job uses; undeclared scopes become none.", "sources": ["https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/4-execution-context-boundaries", "https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax"], "evidence": [{"quote": "Permissions should always be explicitly defined and minimized.", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/4-execution-context-boundaries", "lab n.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/5-agent-execution-limits-protections"], "evidence": [{"quote": "Closing or discarding the pull request", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/5-agent-execution-limits-protections", "label": "Microsoft Learn"}, {"quote": "Reverting commits if changes are merged", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/5-agent-execution-limits-protections", "label": "Microsoft Learn"}, {"quote": "Review all actions through pull requests", "source": "https://learn.microsoft.com/en-us/training/modules/agent-tooling-mcp-execution-environments/5-agent-execution-limits-protections", "label": "Microsoft Learn"}], "whyExam": {"skill": "Implement rollbacks", "strength": "moderate", "clues": [{"kind": "Study guide", "text": "\"Implement rollbacks\" is a named bullet."}, {"kind": "Classic trap", "text": "Force-push and bypass lists are standard wrong options."}]}}, {"id": "m3-u3-three-roles", "type": "match", "domain": "D2", "module": "M3", "unit": "U3", "nugget": "M3-U3-C5", "level": "understand", "reuse": false, "stem": "You are explaining MCP governance to a new team.\n\nWhich component meets each need?", "choices": [{"id": "server", "text": "MCP server"}, {"id": "registry", "text": "MCP registry"}, {"id": "allow", "text": "Allow list policy"}, {"id": "fw", "text": "Cloud agent firewall"}], "targets": [{"id": "t1", "text": "Expose the ticketing system's operations as tools an agent can call.", "answer": "server", "rationale": "The server exposes tools and performs the real action."}, {"id": "t2", "text": "Let developers browse and install the company's approved servers from their IDE.", "answer": "registry", "rationale": "The registry is the catalogue used for discovery and standard installation."}, {"id": "t3", "text": "Prevent developers from using any server the company hasn't appro <script>
(() => {
  "use strict";

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  function h(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = v;
      else if (k === "html") n.innerHTML = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
    return n;
  }
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function inline(s) {
    return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  }
  function md(text) {
    const src = String(text ?? "").trim();
    // fenced code blocks (```lang ... ```) are kept verbatim, blank lines included
    const fenced = src.split(/```[a-z]*\n([\s\S]*?)\n?```/);
    if (fenced.length > 1) return fenced.map((p, i) => (i % 2 ? "<pre class=\"code\"><code>" + esc(p) + "</code></pre>" : (p.trim() ? md(p) : ""))).join("");
    const blocks = src.split(/\n\s*\n/);
    return blocks.map((b) => {
      const lines = b.split("\n");
      if (/^#{2,4}\s+/.test(lines[0])) { const head = "<h4 class=\"md-h\">" + inline(lines[0].replace(/^#{2,4}\s+/, "")) + "</h4>"; const rest = lines.slice(1).join("\n"); return head + (rest.trim() ? md(rest) : ""); }
      if (lines.every((l) => /^\s*-\s+/.test(l))) return "<ul>" + lines.map((l) => "<li>" + inline(l.replace(/^\s*-\s+/, "")) + "</li>").join("") + "</ul>";
      return "<p>" + lines.map(inline).join("<br>") + "</p>";
    }).join("");

    const msg = $("copyMsg");
    const done = () => { msg.textContent = "Copied. Paste it into a Claude chat to analyse your mistakes."; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, msg)); else fallbackCopy(text, msg);
  }
  const canSave = () => !!dl || standalone;
  const attemptName = () => "gh600-attempt-" + new Date(session.finishedAt).toISOString().slice(0, 16).replace(/[:T]/g, "-");
  async function saveFile(name, data) {
    if (!dl && standalone) {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([data], { type: name.endsWith(".md") ? "text/markdown" : "application/json" }));
      a.download = name; document.body.append(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      return;
    }
    if (!dl) return;
    try { await dl.save({ filename: name, data }); }
    catch (e) { if (e && e.code === "unavailable") { dl = null; render(); } }
  }

  // ---------- persistence of attempts (db) ----------
  async function saveAttempt() {
    if (!session || !session.results || (!db && !standalone)) return;
    const r = session.results;
    const weakest = Object.entries(r.byDomain).map(([d, v]) => [d, v.pts / v.n]).sort((a, b) => a[1] - b[1])[0];
    const record = { bankTitle: session.bankTitle, mode: session.cfg.mode, total: r.total, score: r.score, passing: r.passing, pct: Math.round(r.pct * 1000) / 10, weakest: weakest ? weakest[0] : null, startedAt: session.startedAt, finishedAt: session.finishedAt,
        byDomain: Object.fromEntries(Object.entries(r.byDomain).map(([d, v]) => [d, Math.round((v.pts / v.n) * 100)])),
        missed: r.per.filter((x) => x.pts < 1).map((x) => x.u.key) };
    if (!db) { attempts = (storeGet(ATTEMPTS_KEY) || []).concat([record]).slice(-200); storeSet(ATTEMPTS_KEY, attempts); return; }
    try { await db.collection("attempts").add(record); } catch { /* history is optional */ }
  }

  // ---------- action bar ----------
  $("btnPause").addEventListener("click", togglePause);
  // Quit: save and exit (the clock is paused and the attempt can be resumed from the start page) or discard.
  function leaveToStart(msg) {
    clearInterval(timerHandle); session = null;
    $("sbTimer").hidden = true; $("btnPause").hidden = true; $("btnQuit").hidden = true;
    view = "start"; renderStart();
    if (msg) $("main").prepend(h("div", { class: "notice info", role: "status", text: msg }));
  }
  $("btnQuit").addEventListener("click", () => {
    if (!session || session.finished) return;
    const old = document.getElementById("quitMenu"); if (old) { old.remove(); return; }
    const menu = h("div", { class: "notice info", id: "quitMenu", role: "dialog", "aria-label": "Leave this attempt" },
      h("p", { style: "margin:0 0 8px" }, h("strong", null, "Leave this attempt?")),
      h("div", { class: "row" },
        h("button", { type: "button", onclick: () => {
          if (!session.pausedAt) { trackTime(); session.enteredAt = null; session.pausedAt = Date.now(); }
          persist(); leaveToStart("Attempt saved with the clock paused. Resume it from the box at the top of this page.");
        } }, "Save and exit"),
        h("button", { type: "button", class: "danger", onclick: () => { storeSet(SESSION_KEY, null); leaveToStart("Attempt discarded. Nothing was saved."); } }, "Discard attempt"),
        h("button", { type: "button", class: "quiet", onclick: () => menu.remove() }, "Cancel")));
    $("main").prepend(menu); menu.querySelector("button").focus(); window.scrollTo(0, 0);
  });
  $("btnPrev").addEventListener("click", () => go(session.idx - 1));
  $("btnNext").addEventListener("click", () => {
    const u = cur();
    if (session.cfg.mode !== "exam" && isAnswered(u) && !session.revealed[u.key]) { reveal(u); return; }   // first Next shows the result
    if (session.idx === session.live.length - 1) { if (session.fromLesson) backToLesson(); else openReview(); } else go(session.idx + 1);
  });
  $("btnReview").addEventListener("click", openReview);
  $("btnFlag").addEventListener("click", () => { const u = cur(); session.flags[u.key] = !session.flags[u.key]; if (!session.flags[u.key]) delete session.flags[u.key]; persist(); updateBar(); });
  $("btnCheck").addEventListener("click", () => reveal(cur()));

  // ---------- boot ----------
  async function boot() {
    try {
      const res = await fetch("questions.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const b = await res.json();
      if (!setBank(b, "questions.json")) bankSource = "";
    } catch {
      try { const eb = JSON.parse($("embeddedBank").textContent || "null"); if (eb) setBank(eb, "built-in bank"); } catch { /* no embedded bank */ }
    }
    try { const r = await fetch("banks/index.json", { cache: "no-store" }); if (r.ok) { const c = await r.json(); if (Array.isArray(c)) catalog = c.filter((x) => x && x.file && x.title); } } catch { /* no catalog */ }
    render();
    const cl = window.claude;
    if (cl && cl.use) {
      const [dbNs, dlNs] = await Promise.all([cl.use("db").catch(() => null), cl.use("downloads").catch(() => null)]);
      dl = dlNs;
      if (dbNs) {
        db = dbNs;
        const t = setTimeout(() => { if (dbState === "pending") { dbState = "none"; if (view === "start") render(); } }, 10000);
        db.collection("attempts").onSnapshot((qs) => { clearTimeout(t); dbState = "ready"; attempts = qs.docs.map((d) => Object.assign({ id: d.id }, d.data())); if (view === "start") render(); },
          () => { clearTimeout(t); dbState = "none"; if (view === "start") render(); });
      } else { dbState = "none"; }
      if (view === "start") render();
    } else { dbState = "local"; attempts = storeGet(ATTEMPTS_KEY) || []; render(); }
  }
  boot();
})();
</script>

</body></html>
